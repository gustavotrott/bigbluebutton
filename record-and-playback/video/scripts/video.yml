# Configuration for the BigBlueButton "video" recording format.
# Do not modify this file!
# Settings can be customized by creating the file /etc/bigbluebutton/recording/video.yml

# Location in the filesystem where the published recording should be written to
publish_dir: /var/bigbluebutton/published/video

# Location within the filesystem where the playback support files can be found
# (they will get copied into the published recording directory)
playback_dir: /usr/local/bigbluebutton/core/playback/video

# offset applied to audio in the output video file
# audio_offset = 1000 means that the audio will be delayed by 1000ms
audio_offset: 0

# The preset to use for a specific meeting can be set using the bbb-recording-video-preset meta
# parameter. This default will be used if no preset is set, or if a value is specified which does
# not match a known preset.
default_preset: "720p"

# Whether to allow the preset to be configured via the bbb-recording-video-preset meta parameter.
allow_meta_preset: true

# The list of "presets". Each preset corresponds to a specific use case and output quality.
# For each preset, you can specify the size of the output video, how to lay out content in the
# video, and what audio/video encoding settings to use.
#
# The list of presets provided in /etc/bigbluebutton/recording/video.yml will be combined with
# the list of presets shown here. If you create a preset with the same name as one of these
# presets, your preset will *replace* the preset from this file.
presets:
  # Each preset is identified by name
  1080p:
    # The top level 'layout' key is required.
    # It specifies the width, height, and framerate of the output video, and also the default
    # arrangement of content regions within the rendered video.
    layout:
      width: 1920
      height: 1080
      framerate: 24
      areas:
        # Each area must specify a 'name', which says the type of content to display in this area.
        # Supported values are:
        # * 'presentation' (uploaded slides and whiteboard annotations)
        # * 'webcam' (a grid of participant webcam videos)
        # * 'deskshare' (the presenter's shared screen or window)
        # If there is no content of the specified type, the area will not be displayed.
        # If areas overlap, later areas will be drawn over top of earlier areas.
        - { name: presentation, x: 0, y: 0, width: 1600, height: 1080 }
        - { name: webcam, x: 1600, y: 0, width: 320, height: 1080 }
        # Since the deskshare is listed after the presentation area, the deskshare will cover/hide
        # the presentation area while deskshare is in use. The presentation will be visible again
        # after the deskshare stops.
        - { name: deskshare, x: 0, y: 0, width: 1600, height: 1080 }

    # The 'layouts' key is optional. It allows you to specify alternate layouts to use depending on
    # which types of content were shared in the session.
    layouts:
      # Each layout can specify a list of 'required' content types.
      # The layout will only be used if all of the 'required' content types are present in the
      # session.
      #
      # Each layout specifies 'areas', in the same format as the 'layout' key.
      # The layout will only be used if an area is available for every content type which is
      # present in the session. An area can be marked 'hidden' if you want the layout to be used
      # when a certain content type is present, but do not want that content type to be visible.
      #
      # Each layout can specify a list of 'conditions'. The layout will only be used if all of the
      # conditions match the state of the meeting. The currently available conditions are:
      # * presentation_is_open: This is `true` when the main content area of the meeting (which
      #   contains the presentation, screenshare, or webcam as content) is visible, and `false`
      #   when the content area is minimized to leave more space for cameras.
      # * presentation_used: This is `false` at the start of the meeting, and changes to `true`
      #   when a non-default presentation is shared, the slide is changed, or a whiteboard shape is
      #   drawn.
      # * screenshare_as_content: This is `true` when screenshare replaces the presentation in the
      #   main content area, and false otherwise.
      #
      # The order of layouts is important - the first one that matches will be used.
      # If none of the layouts specified here match, then the layout from the 'layout' key will be
      # used instead.

      # If the main content area is minimized, show cameras full-screen.
      # Note that this will leave a blank video if no webcams are being shared (matching the blank
      # BigBlueButton session during the live meeting)
      - areas:
          - { name: presentation, hidden: true }
          - { name: webcam, x: 0, y: 0, width: 1920, height: 1080 }
          - { name: deskshare, hidden: true }
        conditions:
          presentation_is_open: false

      # Various special cases for hiding the deskshare when screenshare_as_content is false.
      #
      # If there are webcams, and the presentation area has not been used, show only webcams
      - required: [ webcam, deskshare ]
        areas:
          - { name: presentation, hidden: true }
          - { name: webcam, x: 0, y: 0, width: 1920, height: 1080 }
          - { name: deskshare, hidden: true }
        conditions:
          presentation_used: false
          screenshare_as_content: false
      # Show presentation with webcams at side if presentation area has been used
      - required: [ presentation, webcam, deskshare ]
        areas:
          - { name: presentation, x: 0, y: 0, width: 1600, height: 1080 }
          - { name: webcam, x: 1600, y: 0, width: 320, height: 1080 }
          - { name: deskshare, hidden: true }
        conditions:
          screenshare_as_content: false
      # Show only presentation if there are no webcams (even if it hasn't been used)
      - required: [ presentation, deskshare ]
        areas:
          - { name: presentation, x: 0, y: 0, width: 1920, height: 1080 }
          - { name: deskshare, hidden: true }
        conditions:
          screenshare_as_content: false

      # Have the webcams cover the whole area of the video if presentation area has not been used
      # and deskshare is not active.
      - required: [ webcam ]
        areas:
          - { name: presentation, hidden: true }
          - { name: webcam, x: 0, y: 0, width: 1920, height: 1080 }
        conditions:
          presentation_used: false

      # Have the presentation area and deskshare cover the whole area of the video if no webcams
      # are being shared
      - areas:
          - { name: presentation, x: 0, y: 0, width: 1920, height: 1080 }
          - { name: deskshare, x: 0, y: 0, width: 1920, height: 1080 }

    # A list of output video file formats and encoding settings to use for this preset
    formats:
      # The default format is very fast to generate, and works by copying the temporary video
      # (using the working format codec defined in core/lib/recordandplayback/edl/video.rb) without
      # an extra re-encoding step.
      - mimetype: 'video/mp4'
        extension: m4v
        parameters:
          - [ '-c:v', 'copy',
              '-c:a', 'aac', '-b:a', '128K',
              '-f', 'mp4', '-movflags', 'faststart' ]
        postprocess: []

      # An alternative is to re-encode the video to vp9. The options selected here are inspired by
      # Google's recommended settings for VOD:
      # https://developers.google.com/media/vp9/settings/vod/#recommended_settings
      # but use slightly higher bitrate/quality settings in order to preserve details in slides and
      # screen sharing.
      #- mimetype: 'video/webm;codecs="vp09.00.41.08,opus"'
      #  extension: webm
      #  parameters:
      #    # Moderate speed single-pass encode
      #    - [ '-c:v', 'libvpx-vp9', '-level', '4.1', '-b:v', '3000K', '-minrate', '1500K', '-maxrate', '4350K',
      #        '-crf', '24', '-quality', 'good', '-speed', '2', '-tile-columns', '2', '-threads', '2',
      #        '-g', '240',
      #        '-c:a', 'libopus', '-b:a', '64K',
      #        '-f', 'webm' ]
      #    # Alternative: Slower but better quality two-pass encode
      #    #- [ '-c:v', 'libvpx-vp9', '-level', '4.1', '-b:v', '3000K', '-minrate', '1500K', '-maxrate', '4350K',
      #    #    '-crf', '24', '-quality', 'good', '-pass', '1', '-speed', '4', '-tile-columns', '2', '-threads', '2',
      #    #    '-g', '240',
      #    #    '-an',
      #    #    '-f', 'webm' ]
      #    #- [ '-c:v', 'libvpx-vp9', '-level', '4.1', '-b:v', '3000K', '-minrate', '1500K', '-maxrate', '4350K',
      #    #    '-crf', '24', '-quality', 'good', '-pass', '2', '-speed', '2', '-tile-columns', '2', '-threads', '2',
      #    #    '-g', '240',
      #    #    '-c:a', 'libopus', '-b:a', '64K',
      #    #    '-f', 'webm' ]
      #    postprocess:
      #      - [ 'mkclean', '--quiet', ':input', ':output' ]

  720p:
    # The default layout has a main content area showing either presentation or deskshare on the
    # left and webcams on the right
    layout:
      width: 1280
      height: 720
      framerate: 24
      areas:
        - { name: presentation, x: 0, y: 0, width: 960, height: 720 }
        - { name: webcam, x: 960, y: 0, width: 320, height: 720 }
        - { name: deskshare, x: 0, y: 0, width: 960, height: 720 }
    layouts:
      # If the main content area is minimized, show cameras full-screen.
      # Note that this will leave a blank video if no webcams are being shared (matching the blank
      # BigBlueButton session during the live meeting)
      - areas:
          - { name: presentation, hidden: true }
          - { name: webcam, x: 0, y: 0, width: 1280, height: 720 }
          - { name: deskshare, hidden: true }
        conditions:
          presentation_is_open: false

      # Various special cases for hiding the deskshare when screenshare_as_content is false.
      #
      # If there are webcams, and the presentation area has not been used, show only webcams
      - required: [ webcam, deskshare ]
        areas:
          - { name: presentation, hidden: true }
          - { name: webcam, x: 0, y: 0, width: 1280, height: 720 }
          - { name: deskshare, hidden: true }
        conditions:
          presentation_used: false
          screenshare_as_content: false
      # Show presentation with webcams at side when presentation area has been used
      - required: [ presentation, webcam, deskshare ]
        areas:
          - { name: presentation, x: 0, y: 0, width: 960, height: 720 }
          - { name: webcam, x: 960, y: 0, width: 320, height: 720 }
          - { name: deskshare, hidden: true }
        conditions:
          screenshare_as_content: false
      # Show only presentation if there are no webcams (even if it hasn't been used)
      - required: [ presentation, deskshare ]
        areas:
          - { name: presentation, x: 0, y: 0, width: 1280, height: 720 }
          - { name: deskshare, hidden: true }
        conditions:
          screenshare_as_content: false

      # Have the webcams cover the whole area of the video if presentation area has not been used
      # and deskshare is not active.
      - required: [ webcam ]
        areas:
          - { name: presentation, hidden: true }
          - { name: webcam, x: 0, y: 0, width: 1280, height: 720 }
        conditions:
          presentation_used: false

      # Show both deskshare and webcams
      # Adjust the deskshare area to be slightly larger than the standard presentation area
      - required: [ webcam, deskshare ]
        areas:
          - { name: presentation, hidden: true }
          - { name: webcam, x: 1040, y: 0, width: 240, height: 720 }
          - { name: deskshare, x: 0, y: 0, width: 1040, height: 720 }

      # Have the presentation area and deskshare cover the whole area of the video if the session
      # did not have any webcams
      - areas:
          - { name: presentation, x: 0, y: 0, width: 1280, height: 720 }
          - { name: deskshare, x: 0, y: 0, width: 1280, height: 720 }
    
    formats:
      - mimetype: 'video/mp4'
        extension: m4v
        parameters:
          - [ '-c:v', 'copy',
              '-c:a', 'aac', '-b:a', '128K',
              '-f', 'mp4', '-movflags', 'faststart' ]
        postprocess: []

      # An alternative is to re-encode the video to vp9. The options selected here are inspired by
      # Google's recommended settings for VOD:
      # https://developers.google.com/media/vp9/settings/vod/#recommended_settings
      # but use slightly higher bitrate/quality settings in order to preserve details in slides and
      # screen sharing.
      #- mimetype: 'video/webm;codecs="vp09.00.41.08,opus"'
      #  extension: webm
      #  parameters:
      #    # Moderate speed single-pass encode
      #    - [ '-c:v', 'libvpx-vp9', '-level', '4.1', '-b:v', '1800K', '-minrate', '900K', '-maxrate', '2610K',
      #        '-crf', '31', '-quality', 'good', '-speed', '2', '-tile-columns', '2', '-threads', '2',
      #        '-g', '240',
      #        '-c:a', 'libopus', '-b:a', '64K',
      #        '-f', 'webm' ]
      #    # Alternative: Slower but better quality two-pass encode
      #    #- [ '-c:v', 'libvpx-vp9', '-level', '4.1', '-b:v', '1800K', '-minrate', '900K', '-maxrate', '2610K',
      #    #    '-crf', '31', '-quality', 'good', '-pass', '1', '-speed', '4', '-tile-columns', '2', '-threads', '2',
      #    #    '-g', '240',
      #    #    '-an',
      #    #    '-f', 'webm' ]
      #    #- [ '-c:v', 'libvpx-vp9', '-level', '4.1', '-b:v', '1800K', '-minrate', '900K', '-maxrate', '2610K',
      #    #    '-crf', '31', '-quality', 'good', '-pass', '2', '-speed', '2', '-tile-columns', '2', '-threads', '2',
      #    #    '-g', '240',
      #    #    '-c:a', 'libopus', '-b:a', '64K',
      #    #    '-f', 'webm' ]
      #    postprocess:
      #      - [ 'mkclean', '--quiet', ':input', ':output' ]

  # A 1080p preset with a context overlay drawn around the media: who is speaking right above the
  # webcams, the name of each webcam, and a column on the right with the meeting name, the recording
  # date, the elapsed time and a "session activity" timeline with what happened in the meeting.
  1080p-context:
    # At most this many webcams are shown at the same time. When more are being shared, the video
    # keeps the ones of who spoke most recently and the overlay tells how many were left out.
    # Remove (or set to 0) to always show every webcam.
    max_webcams: 5
    # The limit while the webcams have the whole picture for themselves (the layouts below in which
    # every other area is hidden). Defaults to max_webcams.
    max_webcams_alone: 12

    layout:
      width: 1920
      height: 1080
      framerate: 24
      # Color of the frame behind the media areas (default: white)
      background: '#0e131f'
      areas:
        - { name: presentation, x: 24, y: 258, width: 1376, height: 798 }
        # 'background' is the color around a video which does not fill its tile.
        # 'max_tile_aspect_ratio' keeps the tiles from growing wider than the cameras, so a couple
        # of webcams stay together in the middle of the strip instead of being spread apart.
        - { name: webcam, x: 24, y: 72, width: 1376, height: 174, background: '#1b2233', max_tile_aspect_ratio: '16/9' }
        - { name: deskshare, x: 24, y: 258, width: 1376, height: 798, background: '#0a0d14' }

    # The context overlay. Remove this section (or set 'enabled: false') to get a plain video.
    overlay:
      enabled: true
      # Language of the labels: en or pt
      locale: en
      # Any text can be replaced, which is also how to use a language the overlay does not have yet. The keys are
      # the ones of STRINGS in bbb_presentation_video/overlay/renderer.py; plurals are [singular, plural].
      #strings:
      #  speaking: Hablando ahora
      #  activity: Actividad de la sesión
      #  participants: ['{n} participante', '{n} participantes']
      #  date: '{day:02d}/{month_number:02d}/{year}'
      # Timezone used to show the recording date (default: the timezone of the server)
      #timezone: America/Sao_Paulo
      font: Noto Sans
      # Colors of the frame, of the session activity panel and of the cards inside it. With
      # 'background_end' the frame is a gradient from top to bottom.
      background: '#0e131f'
      #background_end: '#0e131f'
      panel: '#141a27'
      card: '#1e2638'
      # A blue variation, closer to the colors of the BigBlueButton client:
      #background: '#0f70d7'
      #background_end: '#0a4a94'
      #panel: '#06172a'
      #card: '#0f2a4a'
      # Image shown on the left of the top bar (PNG, JPEG or SVG). Recordings do not store the logo
      # of the meeting, so this is one file for the whole server.
      #logo: /var/www/bigbluebutton-default/assets/images/logo.png
      #logo_height: 40
      #logo_opacity: 0.9
      # Show the picture of the user next to their chat messages, when the join request had an
      # avatarURL. The pictures are downloaded when the video is made. Without one: the initials.
      avatars: true
      # Show a small QR code next to the links (chat messages and external videos), so that who is
      # watching can open them with a phone. Needs the python3-segno package.
      link_qr_code: true
      # Show the timer or stopwatch of the meeting while it is on the screen, at the right end of
      # the place of who is speaking
      timer: true
      # While a video from a link is played, show its address (and QR code) in the place of the
      # presentation: the video itself is not part of the recording
      external_video_notice: true
      # A user who is back within this many seconds (connection lost, page reloaded) is not shown
      # as leaving and joining in the session activity
      rejoin_grace: 120
      # Lines of names in the entry of who was in the meeting when the recording started; the
      # names that do not fit are counted ("and 20 more")
      present_lines: 8
      # Space left between the webcam tiles, in pixels
      tile_gap: 8
      # Who is speaking: one chip per person (picture or initials, and the name), right above the
      # webcams. A taller place (height of 100 or more) becomes a panel with one person per line.
      # Without this, who is speaking goes on the right of the top bar.
      speakers: { x: 24, y: 14, width: 1376, height: 48 }
      # Meeting name with the date and elapsed time below it, and the logo in the corner. A bar
      # wider than 900 has everything on one line instead.
      top_bar: { x: 1416, y: 16, width: 480, height: 104 }
      # The session activity timeline
      activity: { x: 1416, y: 132, width: 480, height: 924 }
      # What is shown in the session activity timeline
      events:
        chat: true            # public chat messages, with the quote of the message answered, the
                              # reactions and the pinned message; deleted messages are never shown
        poll: true            # results of a poll, when it is published
        external_video: true  # an external video was started (shows the URL)
        present: true         # who was already in the meeting when the recording started, in a single
                              # entry (what happens before the recording starts is not shown)
        join: true            # a user joined the meeting
        leave: true           # a user left the meeting
        raise_hand: true      # a user raised their hand
        reaction: true        # a user sent a reaction (shows the emoji)

    layouts:
      # If the main content area is minimized, the cameras take its place
      - areas:
          - { name: presentation, hidden: true }
          - { name: webcam, x: 24, y: 72, width: 1376, height: 984, background: '#1b2233' }
          - { name: deskshare, hidden: true }
        conditions:
          presentation_is_open: false

      # Special cases for hiding the deskshare when screenshare_as_content is false.
      - required: [ webcam, deskshare ]
        areas:
          - { name: presentation, hidden: true }
          - { name: webcam, x: 24, y: 72, width: 1376, height: 984, background: '#1b2233' }
          - { name: deskshare, hidden: true }
        conditions:
          presentation_used: false
          screenshare_as_content: false
      - required: [ presentation, webcam, deskshare ]
        areas:
          - { name: presentation, x: 24, y: 258, width: 1376, height: 798 }
          - { name: webcam, x: 24, y: 72, width: 1376, height: 174, background: '#1b2233', max_tile_aspect_ratio: '16/9' }
          - { name: deskshare, hidden: true }
        conditions:
          screenshare_as_content: false
      - required: [ presentation, deskshare ]
        areas:
          - { name: presentation, x: 24, y: 72, width: 1376, height: 984 }
          - { name: deskshare, hidden: true }
        conditions:
          screenshare_as_content: false

      # Cameras take the place of the presentation while it has not been used
      - required: [ webcam ]
        areas:
          - { name: presentation, hidden: true }
          - { name: webcam, x: 24, y: 72, width: 1376, height: 984, background: '#1b2233' }
        conditions:
          presentation_used: false

      # Without webcams, the presentation or the deskshare also use the space of the camera strip
      - areas:
          - { name: presentation, x: 24, y: 72, width: 1376, height: 984 }
          - { name: deskshare, x: 24, y: 72, width: 1376, height: 984, background: '#0a0d14' }

    formats:
      - mimetype: 'video/mp4'
        extension: m4v
        parameters:
          - [ '-c:v', 'copy',
              '-c:a', 'aac', '-b:a', '128K',
              '-f', 'mp4', '-movflags', 'faststart' ]
        postprocess: []
